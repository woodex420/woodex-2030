name: Known vulnerabilities in the packages
# npm and Composer are asked whether a package this repository installs has a published security advisory
# (master list T-069, T-071). An advisory of ANY severity fails the run unless it is on the written list of the
# ones that are accepted for now, docs/woodex-os/acceptance/advisories.json, where each has its reason. The run
# also fails on an entry without a reason, on an entry that nothing reports any more, and on an advisory whose
# severity has risen since it was accepted (scripts/audit-advisories.mjs; tried by scripts/test-audit-advisories.mjs
# in the shop's gate). No secret is needed: both read the lock files.
#
# Each run also writes, as a notice, which packages named in a package.json or in composer.json have a newer
# version. That judges nothing; it is there to be read on Monday.
#
# It runs when a lock file or the list changes and once a week, because an advisory can be published for a
# package that has not changed here.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"
  push:
    branches: [main, "arena/**"]
    paths: ["package-lock.json", "platform/composer.lock", "docs/woodex-os/acceptance/advisories.json", "scripts/audit-advisories.mjs", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["package-lock.json", "platform/composer.lock", "docs/woodex-os/acceptance/advisories.json", "scripts/audit-advisories.mjs", ".github/workflows/audit.yml"]
permissions:
  contents: read
jobs:
  npm:
    name: "npm: the shop, its API and the scripts"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fail on a known advisory that is not on the list of accepted ones
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node scripts/audit-advisories.mjs npm "$RUNNER_TEMP/npm-audit.json"
      - name: Which packages have a newer version (written as a notice; judges nothing)
        if: always()
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund --ignore-scripts > /dev/null
          npm outdated --json --workspaces --include-workspace-root > "$RUNNER_TEMP/npm-outdated.json" || true
          node scripts/audit-advisories.mjs newer npm "$RUNNER_TEMP/npm-outdated.json"
  composer:
    name: "Composer: the Laravel admin"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Fail on a known advisory that is not on the list of accepted ones
        working-directory: platform
        run: |
          composer audit --locked --format=json > "$RUNNER_TEMP/composer-audit.json" 2> "$RUNNER_TEMP/composer-audit.err" || true
          [ -s "$RUNNER_TEMP/composer-audit.json" ] || { echo "::error title=Composer audit::no answer from the advisory database: $(head -c 300 "$RUNNER_TEMP/composer-audit.err" | tr '\n' ' ')"; exit 1; }
          node ../scripts/audit-advisories.mjs composer "$RUNNER_TEMP/composer-audit.json"
      - name: Which packages have a newer version (written as a notice; judges nothing)
        if: always()
        working-directory: platform
        run: |
          composer outdated --locked --direct --format=json > "$RUNNER_TEMP/composer-outdated.json" 2> "$RUNNER_TEMP/composer-outdated.err" || true
          node ../scripts/audit-advisories.mjs newer composer "$RUNNER_TEMP/composer-outdated.json"
