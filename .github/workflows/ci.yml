name: CI
on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A step-level `if` cannot read the `secrets` context. Referencing it
      # there does not fail the step, it invalidates the entire workflow file,
      # and GitHub then creates no jobs at all -- the run dies in 0s with an
      # empty job list, which reads like an infrastructure blip rather than the
      # syntax error it is. `env` is readable from a step-level `if`, so the
      # availability of the secret is published here as a bare flag.
      #
      # Only the flag goes at job level. The credential itself stays on the one
      # step that needs it, so `npm ci` and the other steps never have the
      # production connection string in their environment.
      HAS_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Secret scan
        run: npm run secret-scan
      - name: Combined Vercel production-shape build
        run: npm run vercel:build
      - name: Storefront lead adapter contract
        run: |
          node scripts/test-storefront-lead-adapter.mjs
          node scripts/test-lead-challenge.mjs
          node scripts/test-basket-adapter.mjs
          node scripts/test-commerce-taxonomy.mjs
          node scripts/test-native-category-sync.mjs
          node scripts/build-category-reference.mjs --check
      - name: Render smoke test (both apps must mount)
        run: npm run smoke:render
      - name: Typecheck both apps
        run: npm run typecheck:all
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: PostgreSQL rehearsal, API security QA, and browser acceptance
        run: node scripts/ci-test.mjs
      # Drift audit against the HOSTED database. Every other DB check here runs
      # against a throwaway Postgres, so none of them can see a hosted database
      # that disagrees with its migrations — which is exactly how
      # tasks_done_boolean went missing in production for weeks.
      #
      # Skipped when the secret is absent (forks, and any run without it) rather
      # than faked: an audit that silently does nothing is the failure mode this
      # whole file exists to prevent.
      - name: Hosted schema drift audit
        if: env.HAS_PRODUCTION_DATABASE_URL == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npm run audit:schema
      - name: Note when the hosted audit was skipped
        if: env.HAS_PRODUCTION_DATABASE_URL != 'true'
        run: echo "::notice::PRODUCTION_DATABASE_URL is not set — hosted schema drift audit skipped. Production is unverified this run."
