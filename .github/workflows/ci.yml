name: CI
on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A step-level `if` cannot read the `secrets` context. Referencing it
      # there does not fail the step, it invalidates the entire workflow file,
      # and GitHub then creates no jobs at all -- the run dies in 0s with an
      # empty job list, which reads like an infrastructure blip rather than the
      # syntax error it is. `env` is readable from a step-level `if`, so the
      # availability of the secret is published here as a bare flag.
      #
      # Only the flag goes at job level. The credential itself stays on the one
      # step that needs it, so `npm ci` and the other steps never have the
      # production connection string in their environment.
      HAS_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Secret scan
        run: npm run secret-scan
      - name: Combined Vercel production-shape build
        run: npm run vercel:build
      - name: Storefront lead adapter contract
        run: |
          node scripts/test-storefront-lead-adapter.mjs
          node scripts/test-lead-challenge.mjs
          node scripts/test-basket-adapter.mjs
          node scripts/test-commerce-taxonomy.mjs
          node scripts/test-native-category-sync.mjs
          node scripts/test-native-product-reader.mjs
          node scripts/test-native-enquiry-bridge.mjs
          node scripts/test-runtime-revision.mjs
          node scripts/test-media-sync.mjs
          node scripts/test-vercel-livewire-root.mjs
          node scripts/build-category-reference.mjs --check
          node scripts/build-product-import.mjs --check
          node scripts/build-woodex-catalogue.mjs --check
      - name: Acceptance files agree with the tests, the journeys and the specification
        # docs/woodex-os/acceptance/ names the test that proves each acceptance scenario of the owner's
        # specification, the journey steps that press each browser flow, and the state of every release gate.
        # Fails when a named test or step has gone, or when document 16 no longer shows what the files say.
        run: node scripts/verify-acceptance.mjs
      - name: The plan of the pending work agrees with the master list
        # docs/woodex-os/21-PENDING-WORK-PLAN-AND-TESTS.md is written from the rows of the master list
        # (14-PRODUCTION-TODO.md) and from docs/woodex-os/acceptance/plan.json. Fails when a line that can start
        # now is in no round or names no test, when a round still holds a line that is done or waits, when the
        # list's own numbers or its "Order of work" no longer agree with its rows, or when document 21 does not
        # show what the two say. The second command tries the check itself: it changes one thing at a time in a
        # copy and requires the check to fail and to name the reason.
        run: |
          node scripts/verify-plan.mjs
          node scripts/test-verify-plan.mjs
      - name: Every table of the old system has its place in the admin
        # docs/woodex-os/acceptance/tables.json says where each table of the old system goes in the Laravel admin
        # (master list T-175). Fails when a table of the old schema files has no row or two, when a row sends
        # rows into a table that no migration of the admin creates, when its owner is not a screen of the admin,
        # when its wave is not the wave the master list gives its line, or when document 36 does not show what
        # the file says. The second command tries the check itself, one mistake at a time.
        run: |
          node scripts/verify-table-map.mjs
          node scripts/test-verify-table-map.mjs
      - name: What the admin is told about the old system's shape is what the schema, the code and the map give
        # platform/resources/data/old-system-shape.json is what an importer of the Laravel admin knows about a
        # table of the old system: the columns of its key, the words a column may hold, and where the map sends
        # its rows (master list T-176 and T-177). The first command builds the old schema on the embedded
        # PostgreSQL from every schema file, asks its catalogue, and fails when the file says anything else: a
        # migration that adds a table, a key or a word, or a changed row of the map, then fails here until the
        # file is written again, and the admin's own tests then ask for the new word's place. The second command
        # tries the check itself, one mistake at a time.
        run: |
          node scripts/verify-old-shape.mjs
          node scripts/test-verify-old-shape.mjs
      - name: The list of accepted security advisories is whole, and the audit that reads it can fail
        # docs/woodex-os/acceptance/advisories.json names the known advisories that are accepted for now, each
        # with its reason (master list T-071). The audit itself asks the advisory databases and runs in its own
        # workflow; here its judgement is tried without a network, one change at a time: a reason taken out, an
        # advisory that is not on the list, an entry that nothing reports any more.
        run: node scripts/test-audit-advisories.mjs
      - name: Every decision, document and requirement the Laravel admin's code names can be looked up
        # The admin's code came from the Interior studio's system and says why a thing is so by naming that
        # system's records: "D-58", "docs/06 §4", "QUO-006". Three of those records are kept, unchanged, in
        # docs/laravel-os/source/ (master list T-174). The first command reads the code and fails, with the file
        # and the line, on a decision, a numbered document or a requirement that is defined neither there nor in
        # this repository's own records, unless docs/laravel-os/source/unresolved.json lists it with its reason;
        # and on one of the three documents that no longer has the checksum of the studio's file. The second
        # command tries the check itself, one change at a time in a copy.
        run: |
          node scripts/verify-code-references.mjs
          node scripts/test-verify-code-references.mjs
      - name: Render smoke test (both apps must mount)
        run: npm run smoke:render
      - name: Typecheck both apps
        run: npm run typecheck:all
      # Uses dist/ from the build step above. One process serves the storefront,
      # the dashboard and the API (the Hostinger shape). This fetches every
      # script and stylesheet the two HTML shells name: the dashboard was a
      # blank page in this shape while a shell-only check passed.
      - name: Single-process shape serves both apps and their bundles
        run: npm run smoke:hostinger
      - name: Install Playwright Chromium
        # Two and a half minutes for apt, then the browser alone: .github/workflows/os-ci.yml says why, at the
        # same line (document 43 of docs/woodex-os, finding AU-28).
        run: timeout -k 10 150 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: PostgreSQL rehearsal, API security QA, and browser acceptance
        run: node scripts/ci-test.mjs
      # Drift audit against the HOSTED database. Every other DB check here runs
      # against a throwaway Postgres, so none of them can see a hosted database
      # that disagrees with its migrations — which is exactly how
      # tasks_done_boolean went missing in production for weeks.
      #
      # Skipped when the secret is absent (forks, and any run without it) rather
      # than faked: an audit that silently does nothing is the failure mode this
      # whole file exists to prevent.
      - name: Hosted schema drift audit
        if: env.HAS_PRODUCTION_DATABASE_URL == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npm run audit:schema
      - name: Note when the hosted audit was skipped
        if: env.HAS_PRODUCTION_DATABASE_URL != 'true'
        run: echo "::notice::PRODUCTION_DATABASE_URL is not set — hosted schema drift audit skipped. Production is unverified this run."
