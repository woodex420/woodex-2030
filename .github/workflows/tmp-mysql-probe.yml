name: tmp mysql probe
on: push
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: woodex_test
          MYSQL_USER: woodex_test
          MYSQL_PASSWORD: disposable-ci-only
          MYSQL_ROOT_PASSWORD: disposable-ci-root
        ports: ["3306:3306"]
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pdisposable-ci-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: woodex_test
      DB_USERNAME: woodex_test
      DB_PASSWORD: disposable-ci-only
      DB_URL: ""
      DB_SOCKET: ""
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, pdo_sqlite, intl, mbstring, bcmath, zip, gd, exif, pcntl, dom, xml, xmlwriter, fileinfo, sodium
          coverage: none
          tools: composer:v2
      - name: Install
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php artisan package:discover --ansi
      - name: Whole group, with the probe
        run: |
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs storage/app/private
          files="$(find tests/Feature -name '*Test.php' | sort | awk -F'tests/Feature/' '{ c = tolower(substr($2, 1, 1)); if (c >= "a" && c <= "f") print }')"
          WX_DEBUG_IDS=1 php -d memory_limit=2G vendor/bin/pest --compact tests/Feature/Api/ProductCatalogueApiTest.php --filter="narrows the list by category" 2>&1 | tail -25
      - name: Read the probe back
        if: always()
        run: |
          python3 - <<'PY'
          import json, glob
          for name in glob.glob('/tmp/probe.json'):
              for i, line in enumerate(json.load(open(name))):
                  print(f"::warning title=probe{i}::{line}")
          PY
