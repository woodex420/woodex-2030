# The one website of the rehearsal (see Dockerfile beside this file). The folder's own .htaccess decides
# everything: nothing about the application is configured here.
ServerName staging.woodex.test

<VirtualHost *:8080>
    DocumentRoot /home/u123456789/domains/staging.woodex.test/public_html

    <Directory /home/u123456789/domains/staging.woodex.test/public_html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
