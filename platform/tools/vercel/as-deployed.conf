# What the Vercel project "woodex-os" sets for the demo, beside WOODEX_DEMO=1 and the four demo passwords.
#
# One place says it, because three things must agree with what is live: the rehearsal that a browser works on in
# CI (.github/workflows/vercel-livewire.yml, "the demo as it is deployed"), the check of the entry
# (tools/vercel/check-entry.sh, section 7), and the check that asks the live site from outside
# (.github/workflows/vercel-live-check.yml), which fails when the live demo does not run with these modules.
#
# Read from Vercel on 21 November 2026 at 12:26 UTC. Both were added that morning with an access token of the
# account, WOODEX_MODULES at 07:32 UTC and LEGACY_DASHBOARD_URL at 07:50 UTC, each followed by a new deployment
# of production. Nothing in the repository had asked for them, and the rehearsal did not run so: the outside check
# failed four hours later (issue #54; docs/woodex-os/13-VERCEL-DEPLOYMENT.md, decision DL-045).
#
# When a setting of the project is changed on Vercel, change it here in the same hour. A line that is taken out
# there is taken out here: the demo then runs with its own choice (api/index.php: the enquiry address and the
# client's pages).
#
# Every module on: the 20 screens that the product ships switched off are open in the demo.
WOODEX_MODULES=*
# The old dashboard, which the React shop serves under /dashboard: Feature status links to its 13 screens.
LEGACY_DASHBOARD_URL=https://woodex-2030.vercel.app/dashboard
